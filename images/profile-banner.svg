<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Indrajeeth Y profile banner</title>
  <desc>Dark editorial banner with name, role, and technical focus.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1480" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111C" />
      <stop offset="0.55" stop-color="#0D1A2C" />
      <stop offset="1" stop-color="#05090F" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1240 130) rotate(123) scale(380 280)">
      <stop stop-color="#E88A57" stop-opacity="0.32" />
      <stop offset="0.45" stop-color="#E88A57" stop-opacity="0.1" />
      <stop offset="1" stop-color="#E88A57" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coolGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 420) rotate(-30) scale(320 180)">
      <stop stop-color="#7DD3FC" stop-opacity="0.2" />
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1600" height="520" rx="36" fill="url(#bg)" />
  <rect width="1600" height="520" rx="36" fill="url(#grid)" />
  <circle cx="1260" cy="130" r="260" fill="url(#glow)" />
  <circle cx="240" cy="420" r="210" fill="url(#coolGlow)" />

  <path d="M1320 56C1410 78 1480 148 1510 236" stroke="#E88A57" stroke-opacity="0.25" stroke-width="2" />
  <path d="M1360 54C1455 82 1525 150 1542 248" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />

  <g filter="url(#shadow)">
    <rect x="92" y="86" width="1416" height="348" rx="28" fill="#09111A" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.1" />
  </g>

  <rect x="128" y="124" width="8" height="180" rx="4" fill="#E88A57" />
  <text x="160" y="176" fill="#F5F1E8" font-size="66" font-weight="700" letter-spacing="-1.5" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
