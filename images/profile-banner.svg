  </text>
  <text x="160" y="222" fill="#C9D4E4" font-size="26" font-weight="500" letter-spacing="0.8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    backend engineer, infra nerd, systems builder
  </text>
  <text x="160" y="272" fill="#90A4BF" font-size="21" font-weight="400" letter-spacing="0.2" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    I build practical tools, stable services, and interfaces that stay out of the way.
  </text>

  <g>
