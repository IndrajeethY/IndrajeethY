    <text x="206" y="333" text-anchor="middle" fill="#F5F1E8" font-size="17" font-weight="600" letter-spacing="0.2" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Go</text>

    <rect x="264" y="308" width="118" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.08" />
    <text x="323" y="333" text-anchor="middle" fill="#F5F1E8" font-size="17" font-weight="600" letter-spacing="0.2" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Python</text>

    <rect x="394" y="308" width="146" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.08" />
    <text x="467" y="333" text-anchor="middle" fill="#F5F1E8" font-size="17" font-weight="600" letter-spacing="0.2" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">TypeScript</text>
  </g>

  <g>
    <rect x="1110" y="126" width="300" height="244" rx="22" fill="#07101A" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.08" />
    <text x="1140" y="166" fill="#E88A57" font-size="16" font-weight="700" letter-spacing="2.4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
