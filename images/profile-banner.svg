    <text x="1140" y="214" fill="#F5F1E8" font-size="27" font-weight="650" letter-spacing="-0.4" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
