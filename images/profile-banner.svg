    <rect x="1140" y="282" width="242" height="1.5" fill="#FFFFFF" fill-opacity="0.1" />

    <text x="1140" y="318" fill="#90A4BF" font-size="16" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
